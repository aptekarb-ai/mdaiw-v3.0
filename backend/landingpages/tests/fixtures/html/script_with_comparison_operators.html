<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Script With Comparisons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Script content using angle brackets as operators, not markup.">
</head>
<body>
  <h1>Script With Comparisons</h1>
  <script>
    function check(a, b) {
      if (a < b && b > 0) {
        return a < 10 ? '<small>' : '<big>';
      }
      return null;
    }
  </script>
</body>
</html>
