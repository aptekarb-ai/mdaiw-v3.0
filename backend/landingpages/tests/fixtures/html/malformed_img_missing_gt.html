<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Malformed Image Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An img start tag missing its closing angle bracket.">
</head>
<body>
  <h1>Malformed Image Tag</h1>
  <div>
    <img src="hero.jpg" alt="Hero image"
    <p>Text right after the broken image tag.</p>
  </div>
</body>
</html>
